<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProxyHub — Autentificare</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#0b1016;--card:#121a23;--line:#1f2b38;--txt:#e6edf3;--mut:#8b9bb0;--acc:#14b8a6;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,#0f2a2a 0,transparent 60%),var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo svg{width:34px;height:34px}
h1{font-size:21px;margin:0;letter-spacing:.2px}
p.sub{color:var(--mut);margin:0 0 22px;font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#0b1218;color:var(--txt);font-size:15px;outline:none}
input:focus{border-color:var(--acc)}
button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:9px;background:var(--acc);color:#04201d;font-weight:650;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.08)}
.err{background:#2a1416;border:1px solid #5b2226;color:var(--bad);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:6px;display:none}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0ea5a4"/><path d="M8 10h10a5 5 0 010 10h-6v4H8zm4 4v2h6a1 1 0 000-2z" fill="#fff"/><circle cx="24" cy="23" r="3" fill="#fde047"/></svg><h1>ProxyHub</h1></div>
  <p class="sub">udpxy + relay de canale · panou de administrare</p>
  <div class="err" id="err"></div>
  <label for="u">Utilizator</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Parolă</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Intră</button>
  <div class="foot">ProxyHub</div>
</form>
<script>
const e=new URLSearchParams(location.search).get('e'),el=document.getElementById('err');
if(e){el.style.display='block';el.textContent=e==='locked'?'Prea multe încercări. Așteaptă 5 minute.':'Utilizator sau parolă greșită.';}
</script>
</body>
</html>
